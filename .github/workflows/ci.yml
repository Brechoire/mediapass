name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DEV: false
      DB_ENGINE: django.db.backends.sqlite3
      DISABLE_SSL: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=env,migrations,.agents,.cursor,.github

      - name: Security scan with bandit
        run: |
          bandit -r . -x env,migrations,test.py,.agents,.cursor --skip=B101 -ll

      - name: Django deploy check
        run: |
          python manage.py check --deploy --fail-level WARNING

      - name: Check pending migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Check for debug print statements
        run: |
          ! grep -rn "print(" --include="*.py" app/ accounts/ shop/ workshop/ notifications/ kakemono/ distribution/ analytics/ home/ visitor_tracking/ library_workshops/ | grep -v "__str__\|#.*print"

      - name: Run tests
        run: |
          python manage.py test --verbosity=2

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:{{ block.style.bg_color|default:'transparent' }};">
  <tr>
    <td align="{{ block.content.align|default:'center' }}" style="padding:{{ block.style.padding|default:'12px 24px' }};font-family:{{ newsletter.font_family }};">
      {% with img=block.image_obj %}
      {% if img %}
        {% if block.content.link %}<a href="{{ block.content.link }}" target="_blank" rel="noopener" style="text-decoration:none;">{% endif %}<img src="{{ site_url }}{{ img.image.url }}" alt="{{ img.alt|default:'' }}" style="display:inline-block;width:{% widthratio block.content.width|default:'100' 100 600 %}px;max-width:100%;height:auto;border:0;border-radius:8px;" />{% if block.content.link %}</a>{% endif %}
      {% elif not for_email %}
        <div style="border:2px dashed #b9cbe8;border-radius:10px;padding:36px 16px;text-align:center;background:#f8fafd;">
          <i class='bx bx-image-alt' style="font-size:30px;color:#8ba3c2;"></i>
          <div style="font-size:13px;font-weight:600;color:#5a6c80;margin-top:8px;">Aucune image pour le moment</div>
          <div style="font-size:12px;color:#93a3b3;margin-top:2px;">Survolez ce bloc puis cliquez sur le crayon ✏️ pour téléverser une image</div>
        </div>
      {% endif %}
      {% endwith %}
    </td>
  </tr>
</table>
